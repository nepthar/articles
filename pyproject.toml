[project]
name = "articles"
version = "0.1.0"
description = "A plain text format for long-form writing that looks good in a terminal and renders to HTML"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
articles = "articles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["articles"]
